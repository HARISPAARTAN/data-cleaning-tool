<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 450" width="1240" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Data-Cleaning Tool pipeline</title>
  <desc id="desc">The input file and the validated profile feed eight stages in a chain: read, structure, normalise, types, validate, dedupe, missing and write. In chunked mode the chain runs per chunk with carried digests, forward-fill state and streaming statistics. Every stage sends events to the ledger, the statistics and the explain log, which feed the JSON report that is rendered to HTML. The write stage produces the cleaned file and the rejects file.</desc>
  <style>
    .bg { fill: #0B0F14; }
    .box { fill: #121820; stroke: #1F2A36; stroke-width: 1.5; }
    .stage { fill: #182130; stroke: #1F2A36; stroke-width: 1.5; }
    .t { fill: #E6EDF3; font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #93A1B0; font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .n { fill: #F2A93B; font: 600 12px ui-monospace, "Cascadia Code", Consolas, monospace; }
    .loop { fill: none; stroke: #F2A93B; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #93A1B0; stroke-width: 1.5; }
    .head { fill: #93A1B0; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #F7F7F4; }
      .box { fill: #FFFFFF; stroke: #DDD9D0; }
      .stage { fill: #FFFFFF; stroke: #C9C4B8; }
      .t { fill: #14181D; }
      .s { fill: #5B6472; }
      .n { fill: #B45309; }
      .loop { stroke: #B45309; }
      .line { stroke: #5B6472; }
      .head { fill: #5B6472; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1240" height="450" rx="16"/>

  <rect class="box" x="20" y="20" width="170" height="64" rx="10"/>
  <text class="t" x="105" y="46" text-anchor="middle">Profile (YAML)</text>
  <text class="s" x="105" y="66" text-anchor="middle">validated before any data</text>
  <path class="line" d="M190,52 H236 V94" marker-end="url(#arrow)"/>

  <rect class="box" x="20" y="140" width="170" height="70" rx="10"/>
  <text class="t" x="105" y="168" text-anchor="middle">Input file</text>
  <text class="s" x="105" y="190" text-anchor="middle">CSV · TSV · TXT · XLSX</text>
  <path class="line" d="M190,175 H218" marker-end="url(#arrow)"/>

  <rect class="loop" x="206" y="96" width="784" height="150" rx="14"/>
  <text class="s" x="598" y="120" text-anchor="middle">per chunk in chunked mode: digests, ffill state, streaming statistics</text>

  <rect class="stage" x="220" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="262" y="164" text-anchor="middle">1</text>
  <text class="t" x="262" y="190" text-anchor="middle">read</text>
  <rect class="stage" x="316" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="358" y="164" text-anchor="middle">2</text>
  <text class="t" x="358" y="190" text-anchor="middle">structure</text>
  <rect class="stage" x="412" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="454" y="164" text-anchor="middle">3</text>
  <text class="t" x="454" y="190" text-anchor="middle">normalise</text>
  <rect class="stage" x="508" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="550" y="164" text-anchor="middle">4</text>
  <text class="t" x="550" y="190" text-anchor="middle">types</text>
  <rect class="stage" x="604" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="646" y="164" text-anchor="middle">5</text>
  <text class="t" x="646" y="190" text-anchor="middle">validate</text>
  <rect class="stage" x="700" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="742" y="164" text-anchor="middle">6</text>
  <text class="t" x="742" y="190" text-anchor="middle">dedupe</text>
  <rect class="stage" x="796" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="838" y="164" text-anchor="middle">7</text>
  <text class="t" x="838" y="190" text-anchor="middle">missing</text>
  <rect class="stage" x="892" y="140" width="84" height="70" rx="8"/>
  <text class="n" x="934" y="164" text-anchor="middle">8</text>
  <text class="t" x="934" y="190" text-anchor="middle">write</text>
  <path class="line" d="M304,175 H314" marker-end="url(#arrow)"/>
  <path class="line" d="M400,175 H410" marker-end="url(#arrow)"/>
  <path class="line" d="M496,175 H506" marker-end="url(#arrow)"/>
  <path class="line" d="M592,175 H602" marker-end="url(#arrow)"/>
  <path class="line" d="M688,175 H698" marker-end="url(#arrow)"/>
  <path class="line" d="M784,175 H794" marker-end="url(#arrow)"/>
  <path class="line" d="M880,175 H890" marker-end="url(#arrow)"/>

  <rect class="box" x="1014" y="96" width="206" height="64" rx="10"/>
  <text class="t" x="1117" y="122" text-anchor="middle">Cleaned file</text>
  <text class="s" x="1117" y="142" text-anchor="middle">CSV · XLSX · Parquet</text>
  <rect class="box" x="1014" y="182" width="206" height="64" rx="10"/>
  <text class="t" x="1117" y="208" text-anchor="middle">Rejects</text>
  <text class="s" x="1117" y="228" text-anchor="middle">removed rows with reasons</text>
  <path class="line" d="M976,166 H995 V128 H1012" marker-end="url(#arrow)"/>
  <path class="line" d="M976,184 H995 V214 H1012" marker-end="url(#arrow)"/>

  <path class="line" d="M262,212 V270 M358,212 V270 M454,212 V270 M550,212 V270 M646,212 V270 M742,212 V270 M838,212 V270 M934,212 V270 M262,270 H934"/>
  <text class="s" x="252" y="274" text-anchor="end">events</text>
  <path class="line" d="M378,270 V298" marker-end="url(#arrow)"/>
  <path class="line" d="M648,270 V298" marker-end="url(#arrow)"/>
  <path class="line" d="M868,270 V298" marker-end="url(#arrow)"/>

  <rect class="box" x="228" y="300" width="300" height="70" rx="10"/>
  <text class="t" x="378" y="328" text-anchor="middle">Ledger</text>
  <text class="s" x="378" y="350" text-anchor="middle">read = out + rejected + duplicates + empty</text>
  <rect class="box" x="548" y="300" width="200" height="70" rx="10"/>
  <text class="t" x="648" y="328" text-anchor="middle">Statistics</text>
  <text class="s" x="648" y="350" text-anchor="middle">before and after</text>
  <rect class="box" x="768" y="300" width="200" height="70" rx="10"/>
  <text class="t" x="868" y="328" text-anchor="middle">Explain log</text>
  <text class="s" x="868" y="350" text-anchor="middle">plan, rules, examples</text>

  <rect class="box" x="1014" y="300" width="206" height="70" rx="10"/>
  <text class="t" x="1117" y="328" text-anchor="middle">JSON report</text>
  <text class="s" x="1117" y="350" text-anchor="middle">rendered to the HTML report</text>
  <path class="line" d="M378,372 V420 M648,372 V420 M868,372 V420 M378,420 H1117"/>
  <path class="line" d="M1117,420 V374" marker-end="url(#arrow)"/>
</svg>
