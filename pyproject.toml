[project]
name = "data-cleaning-tool"
version = "0.1.0"
description = "Cleans messy CSV and Excel exports reproducibly from a YAML profile, with a rejects file and an HTML report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harithas Harikaran" }]
keywords = ["csv", "excel", "data-cleaning", "deduplication", "cli"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=3.0,<4",
  "pydantic>=2.14,<3",
  "click>=8.2,<9",
  "openpyxl>=3.1.5,<4",
  "charset-normalizer>=3.4,<4",
  "PyYAML>=6.0.2,<7",
  "Jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.14,<4"]
parquet = ["pyarrow>=26"]

[project.scripts]
clean-data = "cleandata.cli:main"

[project.urls]
Repository = "https://github.com/HARISPAARTAN/data-cleaning-tool"
Documentation = "https://github.com/HARISPAARTAN/data-cleaning-tool/tree/main/docs"
Demo = "https://harispaartan.github.io/data-cleaning-tool/"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.170.13",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pandas-stubs==3.0.5.260914",
  "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleandata"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "profiles", "fixtures", "docs", "README.md", "README.de.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools"]
addopts = "-ra"
markers = [
  "needs_fuzzy: needs the optional extra fuzzy (rapidfuzz); skipped with the reason when it is absent",
  "needs_parquet: needs the optional extra parquet (pyarrow); skipped with the reason when it is absent",
  "timing: the soft timing check on fixture 5 (run with -m timing)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools"]
# tools/sync_kit.py is portfolio-kit's reference script, kept byte-identical to the kit's copy
extend-exclude = ["tools/sync_kit.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cleandata", "make_data", "support"]

[tool.mypy]
python_version = "3.11"
files = ["src/cleandata"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "charset_normalizer", "rapidfuzz", "rapidfuzz.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
